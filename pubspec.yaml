name: heritage_walk
description: HeritageWalk Sri Lanka project foundation.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.4
dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icons/navigation/
    - assets/icons/actions/
    - assets/icons/categories/
    - assets/icons/support/
    - assets/places/
    - assets/placeholders/
