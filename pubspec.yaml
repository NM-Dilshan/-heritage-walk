name: heritage_walk
description: HeritageWalk Sri Lanka project foundation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_facebook_auth: ^7.2.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/branding/
    - assets/icons/navigation/
    - assets/icons/actions/
    - assets/icons/categories/
    - assets/icons/support/
    - assets/places/
    - assets/placeholders/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"